name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 자동 번역 워크플로가 끝나면 이어서 배포한다.
  # (기본 GITHUB_TOKEN 으로 만든 push 는 다른 워크플로를 트리거하지 못하므로 필요)
  workflow_run:
    workflows: ['Auto-translate new content']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run 으로 들어온 경우에는 번역이 성공했을 때만 배포한다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 이벤트에서도 번역 커밋이 반영된 최신 main 을 받아온다.
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
